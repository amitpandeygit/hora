# Per-graha results for each sayanaadi avastha — book section 15.4.4.
#
# These are NOT life stages. The sayanaadi avastha is a single natal state per
# planet, fixed by the birth data through section 15.4.4's formula. Each entry
# is "what this planet gives while it is in this state", keyed by
# (avastha index, graha) — 12 x 9 = 108 when complete.
#
# Licence-gated like every verbatim source here. See docs/open-items.md OI-12.
schema_version: 2
subject: avastha
qualifier_field: graha
sources:
  pvr-vaia:
    title: 'Vedic Astrology: An Integrated Approach'
    author: P.V.R. Narasimha Rao
    section: 15.4.4 States Related to Activity
    first_published: 2000
    licence_status: unconfirmed
    licence_note: The author shares the book freely for reading. That is not an explicit licence to redistribute
      the text commercially. These entries are stored but are NOT served publicly until the licence is
      confirmed or the text is replaced. See docs/open-items.md OI-12.
categorisation_note: '`verbatim` is the author''s line as printed, including his typos ("dieases",
  "welthy"). `results` is OUR decomposition of that line into conditional clauses; the square-bracket
  conditions are the author''s, the machine-readable `when` structure is ours.'
entries:

