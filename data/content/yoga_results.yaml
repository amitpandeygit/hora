# Results of the planetary yogas — book chapter 11 onward.
#
# What a yoga GIVES, as PVR states it. The detection rules are calculation and
# live in core/constants/yoga_planetary.py; these are interpretive prose and
# are licence-gated like every verbatim source here. See docs/open-items.md
# OI-12.
#
# The subject id is the yoga key from the registry in
# charts/planetary_yogas/. A key here that no longer exists in the registry is
# a transcription left behind; the guard test catches it.
schema_version: 1
subject: planetary_yoga
sources:
  pvr-vaia:
    title: 'Vedic Astrology: An Integrated Approach'
    author: P.V.R. Narasimha Rao
    section: 11.2 to 11.5 — Ravi, Chandra, Pancha Mahapurusha and Naabhasa Yogas
    first_published: 2000
    licence_status: unconfirmed
    licence_note: The author shares the book freely for reading. That is not an explicit licence to redistribute
      the text commercially. These entries are stored but are NOT served publicly until the licence is
      confirmed or the text is replaced. See docs/open-items.md OI-12.
categorisation_note: The `verbatim` field is the author's text as printed. The `term` list is OUR editorial
  split of it and is not part of the book.
entries:
- planetary_yoga: vesi
  name: Vesi Yoga
  source: pvr-vaia
  section: 11.2.1
  licence_status: unconfirmed
  verbatim: One born with this yoga has a balanced outlook. He is truthful, tall and sluggish. He is happy
    and comfortable even with little wealth.
  terms:
  - term: balanced outlook
    category: temperament
  - term: truthful
    category: temperament
  - term: tall
    category: physical
  - term: sluggish
    category: temperament
  - term: happy and comfortable even with little wealth
    category: circumstance
- planetary_yoga: vosi
  name: Vosi Yoga
  source: pvr-vaia
  section: 11.2.2
  licence_status: unconfirmed
  verbatim: One born with this yoga is skillful, charitable, famous, learned and strong.
  terms:
  - term: skillful
    category: aptitude
  - term: charitable
    category: temperament
  - term: famous
    category: circumstance
  - term: learned
    category: aptitude
  - term: strong
    category: physical
- planetary_yoga: ubhayachara
  name: Ubhayachara Yoga
  source: pvr-vaia
  section: 11.2.3
  licence_status: unconfirmed
  verbatim: One born with this yoga has all comforts. He is a king or an equal.
  terms:
  - term: all comforts
    category: circumstance
  - term: a king or an equal
    category: station
- planetary_yoga: budha_aaditya
  name: Budha-Aaditya Yoga
  source: pvr-vaia
  section: 11.2.4
  licence_status: unconfirmed
  verbatim: One born with this yoga is intelligent and skillful in all works. He is well-known, respected
    and happy. Nipuna means an expert.
  transcription_notes: The last sentence glosses the alias rather than stating a result; kept because it
    is printed inside the Results paragraph.
  terms:
  - term: intelligent
    category: aptitude
  - term: skillful in all works
    category: aptitude
  - term: well-known
    category: circumstance
  - term: respected
    category: circumstance
  - term: happy
    category: temperament
- planetary_yoga: sunaphaa
  name: Sunaphaa Yoga
  source: pvr-vaia
  section: 11.3.1
  licence_status: unconfirmed
  verbatim: One born with this yoga becomes a king or an equal. He is intelligent, wealthy and famous.
    He has self-earned wealth.
  terms:
  - term: a king or an equal
    category: station
  - term: intelligent
    category: aptitude
  - term: wealthy
    category: circumstance
  - term: famous
    category: circumstance
  - term: self-earned wealth
    category: circumstance
- planetary_yoga: anaphaa
  name: Anaphaa Yoga
  source: pvr-vaia
  section: 11.3.2
  licence_status: unconfirmed
  verbatim: One born with this yoga becomes a king with good looks. His body is free from disease. He
    is a man of character and has great reputation. He is surrounded by comforts.
  terms:
  - term: a king with good looks
    category: station
  - term: body free from disease
    category: physical
  - term: a man of character
    category: temperament
  - term: great reputation
    category: circumstance
  - term: surrounded by comforts
    category: circumstance
- planetary_yoga: duradhara
  name: Duradhara Yoga
  source: pvr-vaia
  section: 11.3.3
  licence_status: unconfirmed
  verbatim: One born with this yoga enjoys many pleasures. He is charitable. He owns wealth and vehicles.
    He has good servants.
  terms:
  - term: many pleasures
    category: circumstance
  - term: charitable
    category: temperament
  - term: wealth and vehicles
    category: circumstance
  - term: good servants
    category: circumstance
- planetary_yoga: kemadruma
  name: Kemadruma Yoga
  source: pvr-vaia
  section: 11.3.4
  licence_status: unconfirmed
  verbatim: One born with this yoga is unlucky, bereft of intelligence and learning and afflicted by poverty
    and trouble. This bad yoga kills the results of other good yogas in the chart, especially Chandra yogas.
    One with this yoga has to work hard and succeed through great efforts.
  transcription_notes: The middle sentence is a rule about other yogas rather than a result of this one.
    It is applied as a qualifier by the engine and kept here because it is printed inside the Results paragraph.
  terms:
  - term: unlucky
    category: circumstance
  - term: bereft of intelligence and learning
    category: aptitude
  - term: afflicted by poverty and trouble
    category: circumstance
  - term: has to work hard and succeed through great efforts
    category: temperament
- planetary_yoga: chandra_mangala
  name: Chandra-Mangala Yoga
  source: pvr-vaia
  section: 11.3.5
  licence_status: unconfirmed
  verbatim: One born with this yoga is worldly wise and materially successful. He may earn money through
    unscrupulous means. He may treat mother or other women badly.
  terms:
  - term: worldly wise
    category: temperament
  - term: materially successful
    category: circumstance
  - term: may earn money through unscrupulous means
    category: temperament
  - term: may treat mother or other women badly
    category: temperament
- planetary_yoga: adhi
  name: Adhi Yoga
  source: pvr-vaia
  section: 11.3.6
  licence_status: unconfirmed
  verbatim: One born with this yoga becomes a king or a minister or an army chief, depending on the strength
    of the planets involved.
  transcription_notes: The result is graded by strength, which chapter 15's simple-rules measure would
    decide and which is not built. The engine reports the yoga, never which of the three stations.
  terms:
  - term: a king or a minister or an army chief
    category: station
- planetary_yoga: ruchaka
  name: Ruchaka Yoga
  source: pvr-vaia
  section: 11.4.1
  licence_status: unconfirmed
  verbatim: One born with this yoga is a great man of fiery nature. He has a lot of enthusiasm. He is a
    natural leader. He loves to fight wars and he is victorious over enemies. He is discriminative and
    a devotee of learned people. He is well-versed in occult sciences. He has good taste. He is always
    successful.
  terms:
  - term: a great man of fiery nature
    category: temperament
  - term: a lot of enthusiasm
    category: temperament
  - term: a natural leader
    category: station
  - term: victorious over enemies
    category: circumstance
  - term: well-versed in occult sciences
    category: aptitude
  - term: always successful
    category: circumstance
- planetary_yoga: bhadra
  name: Bhadra Yoga
  source: pvr-vaia
  section: 11.4.2
  licence_status: unconfirmed
  verbatim: One born with this yoga is a great man of earthy nature. He is lion-like. He is learned in
    all respects. He has a good build of body and a deep voice. He has sattwa guna. He knows yoga well.
    He is always surrounded by relatives, friends and family and enjoys his wealth with them. He maintains
    cleanliness in everything and he is very systematic. He has a spirit of independence. He is religious.
  terms:
  - term: a great man of earthy nature
    category: temperament
  - term: lion-like
    category: physical
  - term: learned in all respects
    category: aptitude
  - term: a good build of body and a deep voice
    category: physical
  - term: sattwa guna
    category: temperament
  - term: very systematic
    category: temperament
  - term: a spirit of independence
    category: temperament
  - term: religious
    category: temperament
- planetary_yoga: sasa
  name: Sasa Yoga
  source: pvr-vaia
  section: 11.4.3
  licence_status: unconfirmed
  verbatim: One born with this yoga is a great man of airy nature. He is rabbit-like. He is wise and enjoys
    wandering. He is comfortable in forests, mountains and forts. He is valorous and has a slender build.
    He knows the weaknesses of others. He is lively, but has some vacillation. He is charitable.
  transcription_notes: '"rabbit-like" carries footnote 29, whose text has not been supplied. Sasa is the
    Sanskrit for hare or rabbit, which is what the sentence is glossing.'
  terms:
  - term: a great man of airy nature
    category: temperament
  - term: rabbit-like
    category: physical
  - term: wise and enjoys wandering
    category: temperament
  - term: a slender build
    category: physical
  - term: lively, but has some vacillation
    category: temperament
  - term: charitable
    category: temperament
- planetary_yoga: maalavya
  name: Maalavya Yoga
  source: pvr-vaia
  section: 11.4.4
  licence_status: unconfirmed
  verbatim: One born with this yoga is a great man of watery nature. He emits a lustre akin to moonlight.
    He enjoys tasty food. He has luxuries. He has excellent health. He is well-versed in arts.
  transcription_notes: The heading spells the name "Maalavya" and the Definition beneath it "Malavya".
    See docs/book-deviations.md D-31.
  terms:
  - term: a great man of watery nature
    category: temperament
  - term: a lustre akin to moonlight
    category: physical
  - term: luxuries
    category: circumstance
  - term: excellent health
    category: physical
  - term: well-versed in arts
    category: aptitude
- planetary_yoga: hamsa
  name: Hamsa Yoga
  source: pvr-vaia
  section: 11.4.5
  licence_status: unconfirmed
  verbatim: One born with this yoga is a great man of ethery nature. He is swan-like. He has spiritual strength
    and purity. He is respected by everyone. He is very passionate. He becomes a king. He has all comforts.
    He enjoys life fully. He is a clever conversationalist and endowed with good speech.
  transcription_notes: '"swan-like" carries footnote 30, whose text has not been supplied. Hamsa is the
    Sanskrit for swan. The Definition above these results misnames the yoga "Ruchaka"; see D-30.'
  terms:
  - term: a great man of ethery nature
    category: temperament
  - term: swan-like
    category: physical
  - term: spiritual strength and purity
    category: temperament
  - term: respected by everyone
    category: circumstance
  - term: becomes a king
    category: station
  - term: a clever conversationalist and endowed with good speech
    category: aptitude
- planetary_yoga: rajju
  name: Rajju Yoga
  source: pvr-vaia
  section: 11.5.1
  licence_status: unconfirmed
  verbatim: One born with this yoga likes to travel. He has good looks and flourishes in foreign countries.
    He is cruel. Rajju means a rope.
  transcription_notes: The last sentence glosses the name rather than stating a result, like Nipuna's in
    11.2.4. Kept because it is printed inside the same paragraph.
  terms:
  - term: likes to travel
    category: temperament
  - term: good looks
    category: physical
  - term: flourishes in foreign countries
    category: circumstance
  - term: cruel
    category: temperament
- planetary_yoga: musala
  name: Musala Yoga
  source: pvr-vaia
  section: 11.5.1
  licence_status: unconfirmed
  verbatim: One born with this yoga has honor, wisdom and wealth. Kings like him. He is famous. He has many
    children. He has a firm spirit. Musala means a pestle.
  terms:
  - term: honor, wisdom and wealth
    category: circumstance
  - term: Kings like him
    category: station
  - term: famous
    category: circumstance
  - term: many children
    category: circumstance
  - term: a firm spirit
    category: temperament
- planetary_yoga: nala
  name: Nala Yoga
  source: pvr-vaia
  section: 11.5.1
  licence_status: unconfirmed
  verbatim: One born with this yoga has a poor physique. He accumulates money. He has good looks and helps
    relatives. He is skillful.
  transcription_notes: Unlike Rajju and Musala, the book gives no gloss for the name Nala.
  terms:
  - term: a poor physique
    category: physical
  - term: accumulates money
    category: circumstance
  - term: good looks
    category: physical
  - term: helps relatives
    category: temperament
  - term: skillful
    category: aptitude
- planetary_yoga: maalaa
  name: Maalaa Yoga
  source: pvr-vaia
  section: 11.5.2
  licence_status: unconfirmed
  verbatim: One born with this yoga is always happy. He has nice clothes, vehicles, luxuries and friendship
    of many women. Maalaa means a garland.
  terms:
  - term: always happy
    category: temperament
  - term: nice clothes, vehicles, luxuries
    category: circumstance
  - term: friendship of many women
    category: circumstance
- planetary_yoga: sarpa
  name: Sarpa Yoga
  source: pvr-vaia
  section: 11.5.2
  licence_status: unconfirmed
  verbatim: One born with this yoga is miserable, unhappy, cruel, poor and dependent on others for food.
    This is a very bad combination. Sarpa means a serpant.
  transcription_notes: '"serpant" is printed for "serpent". Transcribed as printed.'
  terms:
  - term: miserable
    category: temperament
  - term: unhappy
    category: temperament
  - term: cruel
    category: temperament
  - term: poor and dependent on others for food
    category: circumstance
